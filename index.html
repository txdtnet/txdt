<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXDT</title>
  <meta name="description" content="TXDT">
  <meta name="theme-color" content="#00205b">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://txdt.com/">
  <meta property="og:title" content="TXDT">
  <meta property="og:description" content="TXDT">
  <meta property="og:image" content="https://txdt.com/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TXDT">
  <meta name="twitter:description" content="TXDT">
  <meta name="twitter:image" content="https://txdt.com/assets/og-image.png">

  <!-- Favicons -->
  <link rel="icon" href="favicons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy: #00205b;
      --red: #bf0a30;
      --white: #ffffff;
    }

    html { height: 100%; }

    body {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--white);
      color: var(--navy);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      max-width: 720px;
      padding: 3rem 1.5rem;
      text-align: center;
    }

    .logo {
      width: 100%;
      max-width: 420px;
      height: auto;
    }

    .domain {
      margin-top: 1.75rem;
      font-size: 1.125rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--navy);
      opacity: 0.85;
    }

    footer {
      padding: 1.5rem;
      font-size: 0.75rem;
      color: var(--navy);
      opacity: 0.75;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 480px) {
      .logo { max-width: 280px; }
      .domain { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main>
    <img src="assets/txdt-logo.svg" alt="TXDT" class="logo" width="768" height="213">
  </main>
</body>
</html>
